<style>

*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 15% 0,#1d2a63 0,transparent 45%),radial-gradient(circle at 90% 100%,#4a3a0a55 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);min-height:100vh}

.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-bottom:16px;box-shadow:0 8px 30px #0006}
.hero{background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(255,255,255,.04));border-color:var(--gold)}.hero small{color:var(--gold2)}.hero h2{font-size:20px;margin:6px 0 0;color:var(--tx)}

.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.d{background:var(--r);color:#fff}
input,select{background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;font:inherit;font-size:16px;width:100%;color-scheme:dark}
option{background:#101a3a;color:#f6f1e3}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;z-index:5;background:rgba(6,9,18,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:2px solid var(--gold)}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}nav button{white-space:nowrap}nav .on{outline:2px solid var(--gold2)}
main{padding:0 16px 40px;max-width:1050px;margin:auto}

.ok{color:var(--g);font-weight:700}.no{color:var(--r);font-weight:700}

#lock .card{max-width:360px;width:100%;text-align:center;border-color:var(--gold)}
video,canvas{width:100%;max-width:320px;border-radius:14px;background:#000}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}.chip input{width:auto;margin-left:6px}
.paper{background:#fff;color:#1a1a2e;border-radius:6px;padding:28px 32px;max-width:794px;margin:0 auto 14px;box-shadow:0 10px 40px #0008;font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif}
.paper .pk{text-align:center;font-family:Amiri,serif;font-size:26px;font-weight:700;margin-bottom:2px}
.paper h2{text-align:center;font-size:18px;color:#1a1a2e;border-bottom:3px double #8a6d1d;padding-bottom:10px;margin-bottom:6px}
.paper .sub{text-align:center;color:#555;font-size:13px;margin-bottom:14px}
.paper table{font-size:13px}.paper th{background:#f3ecd2;color:#1a1a2e;border:1px solid #bbb}.paper td{border:1px solid #ccc;color:#1a1a2e;white-space:normal}
.paper .sig{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:46px;text-align:center;font-size:12px}.paper .sig div{border-top:1px solid #333;padding-top:6px}
#sheet{display:none}
@media print{@page{size:A4;margin:12mm}html,body{background:#fff!important}body>*:not(#sheet){display:none!important}#sheet{display:block!important}#sheet .paper{box-shadow:none;max-width:none;padding:0;margin:0}.paper th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div id="lock"><div class="card"><div class="crest">🏛️</div><h1 class="ttl">قائمقامية قضاء السماوة</h1><p class="mu">دليل الموظف — أدخل الرمز للدخول</p>

<header><div><div class="ttl sm">🏛️ قائمقامية قضاء السماوة</div><div id="who2" class="mu"></div></div><span><small id="net">💾 محلي</small> <span id="who" class="ok"></span> <button class="btn s" onclick="location.reload()">خروج</button></span></header>
<nav id="nav"></nav><main id="v"></main></div>
<div id="sheet"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
// ===== ضع إعدادات مشروعك من Firebase Console هنا =====
const FIREBASE_CONFIG={apiKey:"AIzaSyCuiPTtkgotBp90q_AEklmjvf8zXk5rSLk",authDomain:"inadnout-f3368.firebaseapp.com",projectId:"inadnout-f3368",storageBucket:"inadnout-f3368.firebasestorage.app",messagingSenderId:"221743078655",appId:"1:221743078655:web:1467b95d3dbe4f2db700ca"};
firebase.initializeApp(FIREBASE_CONFIG);
const KEYS=["director","manager","accounting","hr"],ROLES=["مدير الدائرة","مدير الإدارة","مسؤول الحاسبة","مسؤول الموظفين"];
const INFO=[{t:"مدير الدائرة",n:["الحقوقي عدي قاسم محمد الاعرجي"]},{t:"مدير الإدارة",n:["سماهر عبد الكاظم","محمد عفات","باسم رزاق"]},{t:"مسؤول الحاسبة",n:["حسين عبد المجيد"]},{t:"مسؤول الموظفين",n:["ياسر عامر برغش"]}];let ri=0;
const TABS=[["dash","📊 الرئيسية"],["emp","👥 الموظفون"],["att","🕒 الحضور"],["grd","💂 الحراس"],["lv","🏖️ الإجازات"],["mov","🚗 سجل الحركات"],["nt","📝 الملاحظات"],["face","🧑‍💻 بصمة الوجه"]];
let S={emps:[],att:[],lv:[]},role=ROLES[0],tab="dash";
try{S=JSON.parse(localStorage.getItem("hrdb"))||S}catch(e){}
S.notes=S.notes||[];S.mov=S.mov||[];let NF="day",DB=null,seeded={};
const save=()=>{try{localStorage.setItem("hrdb",JSON.stringify(S))}catch(e){}};
function put(c,r){r.by=r.by||role;const i=S[c].findIndex(x=>x.id==r.id);i<0?S[c].push(r):S[c][i]=r;save();if(DB)DB.collection(c).doc(String(r.id)).set(r).catch(()=>{})}
function del(c,id){S[c]=S[c].filter(x=>x.id!=id);save();if(DB)DB.collection(c).doc(String(id)).delete().catch(()=>{})}
function setNet(o){const n=document.getElementById("net");if(n)n.textContent=o?"🌐 متصل ومشترك":"💾 محلي"}
async function net(){try{DB=firebase.firestore();
["emps","att","lv","notes","mov"].forEach(c=>DB.collection(c).onSnapshot(s=>{if(s.empty&&S[c].length&&!seeded[c]){seeded[c]=1;S[c].forEach(r=>DB.collection(c).doc(String(r.id)).set(r).catch(()=>{}));return}seeded[c]=1;S[c]=s.docs.map(d=>d.data());save();setNet(1);const a=document.activeElement;if(!document.getElementById("app").hidden&&tab!="face"&&!(a&&a.matches("input,select")))go(tab)},()=>setNet(0)))}catch(e){}}
function addN(){const t=$("nx").value.trim();if(!t)return;put("notes",{id:uid(),eid:$("ne").value,date:$("nd").value,text:t});go("nt")}
const $=i=>document.getElementById(i),uid=()=>Date.now()+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),nowT=()=>new Date().toTimeString().slice(0,5);
const canEdit=()=>true;
const KIND={daily:"يومية",hourly:"زمنية (ساعات)",sick:"مرضية",annual:"استحقاق سنوية",unpaid:"سنة بدون راتب",seven:"7 أيام"};
const DAYS={seven:7};
const addD=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const lvDays=l=>l.kind=="hourly"?1:l.kind=="seven"?7:l.kind=="unpaid"?365:(l.amt||1);
function onLeave(){const t=today(),L=S.lv.filter(l=>l.date<=t&&t<=addD(l.date,lvDays(l)-1));return L.length?`<div class="tw"><table><tr><th>الموظف</th><th>النوع</th><th>حتى تاريخ</th><th>البديل</th></tr>${L.map(l=>`<tr><td>${esc(ename(l.eid))}</td><td>${KIND[l.kind]}</td><td>${addD(l.date,lvDays(l)-1)}</td><td>${l.sub?esc(ename(l.sub)):"—"}</td></tr>`).join("")}</table></div>`:`<p class="mu">لا يوجد مجازون اليوم</p>`}
function addM(){const c=$("mc").value.trim();if(!c)return;const mem=[...document.querySelectorAll("input[name=mm]:checked")].map(x=>x.value).join("، ");put("mov",{id:uid(),date:$("md").value,com:c,place:$("mp").value,task:$("mt").value,out:$("mo").value,back:$("mb").value,mem});go("mov")}
function retM(id){const m=S.mov.find(x=>x.id==id);if(m){m.back=nowT();put("mov",m);go("mov")}}
const PL={day:"اليوم",week:"آخر 7 أيام",month:"هذا الشهر",all:"الكل"},PER={att:"day",grd:"day",lv:"month",nt:"day",mov:"month"},ST={in:"حضور",out:"انصراف",absent:"غياب"};
const inR=(d,p)=>{if(p=="all")return true;const ds=today();if(p=="day")return d==ds;if(p=="week"){const x=(new Date(ds)-new Date(d))/864e5;return x>=0&&x<7}return d.slice(0,7)==ds.slice(0,7)};
const bar=t=>`<div class="row"><select onchange="PER['${t}']=this.value;go('${t}')">${Object.entries(PL).map(([k,v])=>`<option value="${k}" ${PER[t]==k?"selected":""}>${v}</option>`).join("")}</select><button class="btn" onclick="printRep('${t}')">🖨️ طباعة / حفظ PDF</button></div>`;
function repData(t){const p=PER[t];let title,heads,recs,rows;
if(t=="att"||t=="grd"){const g=t=="grd";title=g?"سجل حضور وانصراف وغياب الحراس":"سجل الحضور والانصراف والغياب";heads=["التاريخ","الاسم","الحالة","الوقت","بواسطة"];recs=S.att.filter(a=>inR(a.date,p)&&!!S.emps.find(e=>e.id==a.eid&&!!e.guard==g)).sort((a,b)=>a.date.localeCompare(b.date));rows=recs.map(a=>[a.date,ename(a.eid),ST[a.type],a.time||"—",a.by||""])}
else if(t=="lv"){title="سجل الإجازات";heads=["التاريخ","الموظف","النوع","المدة","البديل","رصيد الشهر","بواسطة"];recs=S.lv.filter(l=>inR(l.date,p)).sort((a,b)=>a.date.localeCompare(b.date));rows=recs.map(l=>[l.date,ename(l.eid),KIND[l.kind],l.kind=="hourly"?l.amt+" ساعة":(DAYS[l.kind]||l.amt)+" يوم",l.sub?ename(l.sub):"—",bal(l.eid,l.date.slice(0,7))>0?"لديه رصيد":"لا رصيد",l.by||""])}
else if(t=="mov"){title="سجل حركات اللجان خارج الدائرة";heads=["التاريخ","اللجنة","الأعضاء","جهة الذهاب","المهمة","الخروج","العودة","بواسطة"];recs=S.mov.filter(m=>inR(m.date,p)).sort((a,b)=>a.date.localeCompare(b.date));rows=recs.map(m=>[m.date,m.com,m.mem||"—",m.place||"—",m.task||"—",m.out||"—",m.back||"—",m.by||""])}
else{title="الملاحظات والمطالعات";heads=["التاريخ","الخاص بـ","الملاحظة","بواسطة"];recs=S.notes.filter(n=>inR(n.date,p)).sort((a,b)=>a.date.localeCompare(b.date));rows=recs.map(n=>[n.date,n.eid?ename(n.eid):"عامة",n.text,n.by||""])}
return{title,heads,rows,recs}}
function paperHTML(t,edit){const d=repData(t);return `<div class="paper"><div class="pk">🏛️ قائمقامية قضاء السماوة</div><h2>${d.title}</h2><div class="sub">الفترة: ${PL[PER[t]]} · تاريخ الطباعة: ${today()} ${nowT()} · أعدّه: ${esc(role)}</div><table><tr><th>#</th>${d.heads.map(h=>`<th>${h}</th>`).join("")}${edit?"<th></th>":""}</tr>${d.rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${esc(c)}</td>`).join("")}${edit?`<td><button class="btn d" onclick="del('notes','${d.recs[i].id}');go('nt')">حذف</button></td>`:""}</tr>`).join("")||`<tr><td colspan="9">لا توجد سجلات</td></tr>`}</table><div class="sig">${INFO.map(x=>`<div>${x.t}<br><small>${x.n.join(" / ")}</small></div>`).join("")}</div></div>`}
function printRep(t){$("sheet").innerHTML=paperHTML(t);setTimeout(()=>window.print(),150)}
let IMG=null;
function fileSig(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{IMG=im;$("fm").textContent="تم تحميل الصورة: اختر الآن تسجيل الوجه أو تسجيل الحضور"};im.src=URL.createObjectURL(f)}
$("roles").innerHTML=ROLES.map((r,i)=>`<label class="card" style="margin:0;padding:8px"><input type="radio" name="r" value="${r}" ${i?"":"checked"} style="width:auto"> ${r}</label>`).join("");
async function login(){const i=ROLES.indexOf(document.querySelector("input[name=r]:checked").value);
try{await firebase.auth().signInWithEmailAndPassword(KEYS[i]+"@hr.local",$("pin").value)}catch(e){$("err").textContent="الرمز غير صحيح أو تعذر الاتصال ("+(e.code||e.message)+")";return}
role=ROLES[i];$("lock").hidden=true;$("app").hidden=false;ri=i;$("who2").textContent=INFO[i].t+" — "+INFO[i].n.join(" / ");nav();net();go("dash")}
function nav(){$("nav").innerHTML=TABS.map(t=>`<button class="btn s ${t[0]==tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}
function go(t){tab=t;nav();stopCam();$("v").innerHTML=VIEWS[t]()}
const ename=id=>(S.emps.find(e=>e.id==id)||{name:"(محذوف)"}).name;
const empOpts=g=>S.emps.filter(e=>g===undefined||!!e.guard===g).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");
// رصيد الشهر: 4 أيام، كل 3 ساعات زمنية = يوم
function used(eid,m){let d=0;S.lv.filter(l=>l.eid==eid&&l.date.slice(0,7)==m&&(l.kind=="daily"||l.kind=="hourly")).forEach(l=>d+=l.kind=="hourly"?l.amt/3:l.amt);return d}
const bal=(eid,m=today().slice(0,7))=>4-used(eid,m);
const VIEWS={
dash(){const t=today(),p=S.att.filter(a=>a.date==t&&a.type=="in").length,ab=S.att.filter(a=>a.date==t&&a.type=="absent").length;
return `<div class="card hero"><small>مرحباً بك</small><h2>${INFO[ri].t} — ${INFO[ri].n.join(" / ")}</h2></div><div class="stats" style="margin-bottom:14px"><div class="card stat"><b>${S.emps.length}</b>الموظفون</div><div class="card stat"><b>${p}</b>حاضرون اليوم</div><div class="card stat"><b>${ab}</b>غائبون اليوم</div><div class="card stat"><b>${S.lv.length}</b>إجازات مسجلة</div></div>
<div class="card"><h2>🏖️ المجازون اليوم</h2>${onLeave()}</div>
<div class="card"><h2>رصيد الإجازة هذا الشهر</h2><div class="tw"><table><tr><th>الموظف</th><th>المستهلك</th><th>المتبقي</th><th>رصيد؟</th></tr>${S.emps.map(e=>{const b=bal(e.id);return `<tr><td>${esc(e.name)}</td><td>${used(e.id,today().slice(0,7)).toFixed(1)} يوم</td><td>${b.toFixed(1)} يوم</td><td class="${b>0?"ok":"no"}">${b>0?"نعم ✔":"لا ✖"}</td></tr>`}).join("")||"<tr><td>لا يوجد موظفون</td></tr>"}</table></div></div>`},
emp(){return `${canEdit()?`<div class="card"><h2>إضافة موظف</h2><div class="row"><input id="n" placeholder="الاسم"><input id="j" placeholder="المسمى الوظيفي"><select id="g"><option value="">موظف</option><option value="1">حارس</option></select></div><button class="btn" onclick="addE()">إضافة</button></div>`:""}
<div class="card"><h2>دليل الموظفين</h2><div class="tw"><table><tr><th>الاسم</th><th>الوظيفة</th><th>النوع</th><th>بصمة وجه</th><th></th></tr>${S.emps.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.job)}</td><td>${e.guard?"حارس":"موظف"}</td><td>${e.face?"✔":"—"}</td><td>${canEdit()?`<button class="btn d" onclick="delE('${e.id}')">حذف</button>`:""}</td></tr>`).join("")}</table></div></div>`},
att(){return attView(false)},grd(){return attView(true)},
lv(){return `${canEdit()?`<div class="card"><h2>تسجيل إجازة</h2><div class="row"><select id="le">${empOpts()}</select><select id="lk">${Object.entries(KIND).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><input id="la" type="number" min="1" value="1" placeholder="العدد (أيام/ساعات)"><input id="ld" type="date" value="${today()}"><select id="ls"><option value="">الموظف البديل (اختياري)</option>${empOpts()}</select></div><button class="btn" onclick="addL()">حفظ</button><p style="color:var(--mu)">كل 3 ساعات زمنية = يوم، ولكل موظف 4 أيام شهرياً.</p></div>`:""}
<div class="card"><h2>سجل الإجازات</h2>${bar('lv')}<div class="tw"><table><tr><th>التاريخ</th><th>الموظف</th><th>النوع</th><th>المدة</th><th>البديل</th><th>رصيد الشهر</th><th>بواسطة</th><th></th></tr>${S.lv.filter(l=>inR(l.date,PER.lv)).slice().reverse().map(l=>{const b=bal(l.eid,l.date.slice(0,7));return `<tr><td>${l.date}</td><td>${esc(ename(l.eid))}</td><td>${KIND[l.kind]}</td><td>${l.kind=="hourly"?l.amt+" ساعة":(DAYS[l.kind]||l.amt)+" يوم"}</td><td>${l.sub?esc(ename(l.sub)):"—"}</td><td class="${b>0?"ok":"no"}">${b>0?"لديه رصيد":"لا رصيد"}</td><td>${esc(l.by||"")}</td><td><button class="btn d" onclick="del('lv','${l.id}');go('lv')">حذف</button></td></tr>`}).join("")}</table></div></div>`},
mov(){return `<div class="card"><h2>🚗 تسجيل حركة لجنة خارج الدائرة</h2><div class="row"><input id="mc" placeholder="اسم / عنوان اللجنة"><input id="mp" placeholder="جهة الذهاب (المكان)"><input id="md" type="date" value="${today()}"><input id="mo" type="time" value="${nowT()}"><input id="mb" type="time" title="وقت العودة"></div><input id="mt" placeholder="المهمة / الغرض من الحركة" style="margin-bottom:10px"><div class="chips">${S.emps.map(e=>`<label class="chip"><input type="checkbox" name="mm" value="${esc(e.name)}">${esc(e.name)}</label>`).join("")||`<span class="mu">أضف موظفين أولاً</span>`}</div><button class="btn" onclick="addM()">حفظ الحركة</button><p class="mu">اترك «العودة» فارغاً، ثم اضغط «تسجيل العودة» عند رجوع اللجنة.</p></div>
<div class="card">${bar('mov')}<div class="tw"><table><tr><th>التاريخ</th><th>اللجنة</th><th>الأعضاء</th><th>الجهة</th><th>المهمة</th><th>الخروج</th><th>العودة</th><th>بواسطة</th><th></th></tr>${S.mov.filter(m=>inR(m.date,PER.mov)).slice().reverse().map(m=>`<tr><td>${m.date}</td><td>${esc(m.com)}</td><td style="white-space:normal">${esc(m.mem||"—")}</td><td>${esc(m.place||"—")}</td><td style="white-space:normal">${esc(m.task||"—")}</td><td>${m.out||"—"}</td><td>${m.back||`<button class="btn s" onclick="retM('${m.id}')">تسجيل العودة</button>`}</td><td>${esc(m.by||"")}</td><td><button class="btn d" onclick="del('mov','${m.id}');go('mov')">حذف</button></td></tr>`).join("")}</table></div></div>`},
nt(){return `<div class="card"><h2>إضافة ملاحظة / مطالعة</h2><div class="row"><select id="ne"><option value="">عامة</option>${empOpts()}</select><input id="nd" type="date" value="${today()}"><input id="nx" placeholder="نص الملاحظة"></div><button class="btn" onclick="addN()">حفظ</button></div>
<div class="card">${bar('nt')}</div>${paperHTML('nt',true)}`},
face(){return `<div class="card"><h2>تسجيل الحضور ببصمة الوجه</h2><video id="vid" autoplay playsinline muted></video><canvas id="cv" hidden></canvas><div class="row" style="margin-top:10px"><select id="fe">${empOpts()}</select></div>
<button class="btn s" onclick="startCam()">📷 تشغيل الكاميرا</button> <label class="btn s">📸 التقاط صورة<input id="fi" type="file" accept="image/*" capture="user" hidden onchange="fileSig(this)"></label> <button class="btn" onclick="faceVerify()">✅ تسجيل حضور بالوجه</button> <button class="btn s" onclick="faceEnroll()">📸 تسجيل وجه الموظف</button><p id="fm" style="color:var(--mu)"></p>
<p style="color:var(--mu);font-size:12px">ملاحظة: المطابقة هنا تقريبية للتجربة. للإنتاج استخدم face-api.js مع ملفات النماذج داخل المستودع.</p></div>`}};
function attView(g){const t=g?"grd":"att",L=S.att.filter(a=>inR(a.date,PER[t])&&!!S.emps.find(e=>e.id==a.eid&&!!e.guard==g)).slice().reverse();
return `<div class="card"><h2>${g?"سجل الحراس":"سجل الحضور"}</h2><div class="row"><select id="ae">${empOpts(g)}</select><select id="at"><option value="in">حضور</option><option value="out">انصراف</option><option value="absent">غياب</option></select><input id="ad" type="date" value="${today()}"></div><button class="btn" onclick="addA()">تسجيل</button></div>
<div class="card">${bar(t)}<div class="tw"><table><tr><th>التاريخ</th><th>الاسم</th><th>الحالة</th><th>الوقت</th><th>بواسطة</th><th></th></tr>${L.map(a=>`<tr><td>${a.date}</td><td>${esc(ename(a.eid))}</td><td class="${a.type=="absent"?"no":"ok"}">${ST[a.type]}</td><td>${a.time||"—"}</td><td>${esc(a.by||"")}</td><td><button class="btn d" onclick="del('att','${a.id}');go(tab)">حذف</button></td></tr>`).join("")}</table></div></div>`}
function addE(){const n=$("n").value.trim();if(!n)return;put("emps",{id:uid(),name:n,job:$("j").value,guard:!!$("g").value});go("emp")}
function delE(id){if(confirm("حذف الموظف؟")){del("emps",id);go("emp")}}
function addA(){if(!$("ae").value)return;put("att",{id:uid(),eid:$("ae").value,type:$("at").value,date:$("ad").value,time:nowT()});go(tab)}
function addL(){if(!$("le").value)return;put("lv",{id:uid(),eid:$("le").value,kind:$("lk").value,amt:+$("la").value||1,date:$("ld").value,sub:$("ls").value==$("le").value?"":$("ls").value});go("lv")}
let stream;
async function startCam(){const m=$("fm");try{if(!navigator.mediaDevices)throw{name:"NoHttps"};stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});const v=$("vid");v.srcObject=stream;v.setAttribute("playsinline","");await v.play();m.textContent="الكاميرا تعمل ✔"}catch(e){stream=null;m.textContent={NotAllowedError:"الكاميرا محجوبة: اسمح بها للموقع من إعدادات المتصفح",NotFoundError:"لا توجد كاميرا في هذا الجهاز",NoHttps:"افتح الموقع عبر https"}[e.name]||"تعذر فتح الكاميرا، استخدم زر التقاط صورة"}}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function sig(el){const c=$("cv");c.width=c.height=16;const x=c.getContext("2d");x.drawImage(el||$("vid"),0,0,16,16);const d=x.getImageData(0,0,16,16).data,o=[];for(let i=0;i<d.length;i+=4)o.push((d[i]+d[i+1]+d[i+2])/3);const m=o.reduce((a,b)=>a+b)/o.length;return o.map(v=>Math.round(v-m))}
function faceEnroll(){const e=S.emps.find(x=>x.id==$("fe").value);const el=stream?$("vid"):IMG;if(!e||!el){$("fm").textContent="شغّل الكاميرا أو التقط صورة أولاً";return}e.face=sig(el);put("emps",e);$("fm").textContent="تم تسجيل وجه "+e.name}
function faceVerify(){const el=stream?$("vid"):IMG;if(!el){$("fm").textContent="شغّل الكاميرا أو التقط صورة أولاً";return}const s=sig(el);let best=null,bd=1e9;S.emps.filter(e=>e.face).forEach(e=>{const d=e.face.reduce((a,v,i)=>a+Math.abs(v-s[i]),0)/256;if(d<bd){bd=d;best=e}});
if(best&&bd<25){put("att",{id:uid(),eid:best.id,type:"in",date:today(),time:nowT()});$("fm").textContent="✅ تم تسجيل حضور "+best.name}else $("fm").textContent="❌ لم يتم التعرف على الوجه"}
</script></body></html>
