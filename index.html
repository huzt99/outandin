<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشاهدة الكاميرا</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
  #status { padding: 14px; font-size: 17px; }
  video { width: 100%; max-height: 80vh; background: #111; }
  button { margin: 14px; padding: 12px 28px; font-size: 16px; border: 0; border-radius: 8px; background: #1976d2; color: #fff; }
</style>
</head>
<body>
<div id="status">جاري التحضير…</div>
<video id="v" autoplay playsinline controls></video>
<div>
  <button id="unmute" style="background:#388E3C">🔊 تشغيل الصوت</button>
  <button id="btn">إعادة الاتصال</button>
</div>

<script>
const DB = "https://tview-12deb-default-rtdb.europe-west1.firebasedatabase.app";
const room = new URLSearchParams(location.search).get("room");
const statusEl = document.getElementById("status");
const video = document.getElementById("v");
let pc = null;
let session = 0;

function setStatus(t) { statusEl.textContent = t; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function randomId() {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  let s = "";
  for (const b of bytes) s += chars[b % chars.length];
  return s;
}

async function api(method, path, body) {
  const options = { method };
  if (body !== undefined) options.body = JSON.stringify(body);
  const res = await fetch(DB + "/" + path + ".json", options);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function connect() {
  if (!room) {
    setStatus("الرابط ناقص: ما فيه كود الغرفة. افتح الرابط من التطبيق.");
    return;
  }
  const my = ++session;
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }

  const sid = randomId();
  const base = "rooms/" + room + "/s/" + sid;
  const startedAt = Date.now();
  setStatus("جاري الاتصال بالكاميرا…");

  const conn = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  });
  pc = conn;

  conn.ontrack = (e) => {
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    video.play().catch(() => {});
  };
  conn.onicecandidate = (e) => {
    if (!e.candidate) return;
    api("POST", base + "/v", {
      sdpMid: e.candidate.sdpMid,
      sdpMLineIndex: e.candidate.sdpMLineIndex,
      candidate: e.candidate.candidate
    }).catch(() => {});
  };
  conn.oniceconnectionstatechange = () => {
    const s = conn.iceConnectionState;
    if (my !== session) return;
    if (s === "connected" || s === "completed") setStatus("متصل ✅");
    else if (s === "disconnected") setStatus("انقطع الاتصال…");
    else if (s === "failed") setStatus("فشل الاتصال. اضغط إعادة الاتصال.");
  };

  try {
    await api("PUT", "rooms/" + room + "/join/" + sid, Date.now());

    // ننتظر عرض الكاميرا (offer)
    let offer = null;
    for (let i = 0; i < 40 && my === session; i++) {
      offer = await api("GET", base + "/offer");
      if (offer) break;
      await sleep(700);
    }
    if (my !== session) return;
    if (!offer) {
      setStatus("الكاميرا ما ردّت. تأكد أن التطبيق شغال على جوال الكاميرا.");
      return;
    }

    await conn.setRemoteDescription({ type: "offer", sdp: offer.sdp });
    const answer = await conn.createAnswer();
    await conn.setLocalDescription(answer);
    await api("PUT", base + "/answer", { type: "answer", sdp: answer.sdp });

    // نستقبل عناوين الاتصال من الكاميرا
    const seen = new Set();
    while (my === session && Date.now() - startedAt < 90000) {
      const list = await api("GET", base + "/c");
      if (list) {
        for (const [key, c] of Object.entries(list)) {
          if (seen.has(key)) continue;
          seen.add(key);
          try {
            await conn.addIceCandidate({
              candidate: c.candidate,
              sdpMid: c.sdpMid,
              sdpMLineIndex: c.sdpMLineIndex
            });
          } catch (e) {}
        }
      }
      if (conn.iceConnectionState === "failed") break;
      await sleep(1000);
    }
  } catch (e) {
    if (my === session) setStatus("خطأ: " + e.message);
  }
}

document.getElementById("btn").addEventListener("click", connect);

document.getElementById("unmute").addEventListener("click", () => {
  video.muted = false;
  video.play().catch(() => {});
  document.getElementById("unmute").style.display = "none";
});

connect();
</script>
</body>
</html>
